<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="ui/settings.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>Settings</h1>
    </header>

    <section class="api-settings" lang="ru" aria-labelledby="deepseekHeading">
      <h2 id="deepseekHeading">DeepSeek для Quiz</h2>
      <p class="settings-help">Вопросы Quiz отправляются напрямую в DeepSeek с твоим ключом.
        Оплаты расширения нет; запросы оплачиваются по тарифам DeepSeek.</p>
      <form id="deepseekForm">
        <label for="deepseekApiKey">API-ключ DeepSeek</label>
        <input type="password" id="deepseekApiKey" autocomplete="off" spellcheck="false"
          placeholder="Вставь API-ключ" maxlength="512" aria-describedby="deepseekKeyStatus deepseekPrivacy" />
        <p id="deepseekKeyStatus" class="settings-help">Загрузка…</p>

        <label for="deepseekModel">Модель</label>
        <select id="deepseekModel">
          <option value="deepseek-flash">DeepSeek Flash</option>
          <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
        </select>
        <p id="deepseekPrivacy" class="settings-help">Ключ хранится в этом браузере и не синхронизируется.
          Получить ключ: <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener noreferrer">DeepSeek Platform</a>.</p>

        <div class="api-actions">
          <button type="submit" id="saveDeepseekBtn">Сохранить DeepSeek</button>
          <button type="button" id="removeDeepseekKeyBtn" class="secondary-button" disabled>Удалить ключ</button>
        </div>
        <div id="deepseekStatus" role="status" aria-live="polite"></div>
      </form>
    </section>

    <div id="additional" class="tab-content active">
      <section>
        <h3>Speech Settings</h3>
        <div class="setting-item">
          <input type="checkbox" id="speechToggle" />
          <label for="speechToggle">Enable Speech Guide</label>
        </div>
      </section>

      <section>
        <h3>Automation Settings</h3>
        <div class="setting-item">
          <input type="checkbox" id="attemptAllQuizToggle" />
          <label for="attemptAllQuizToggle">Attempt All Quiz</label>
        </div>
        <div class="setting-item">
          <input type="checkbox" id="autoQuizToggle" />
          <label for="autoQuizToggle">Auto Quiz Attempt</label>
        </div>
        <div class="setting-item">
          <input type="checkbox" id="autoSubmitQuizToggle" />
          <label for="autoSubmitQuizToggle">Auto Submit Quiz</label>
        </div>
        <!-- Keep the legacy settings script's element reference without showing subscription controls. -->
        <input type="checkbox" id="autoPopupToggle" hidden />
      </section>

      <button id="saveAdditionalBtn">💾 Save</button>
      <div id="additionalStatus"></div>
    </div>
  </div>

  <script src="scripts/settings.js"></script>
  <script src="scripts/deepseek-settings.js"></script>
</body>

</html>
